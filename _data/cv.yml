    Osmania University. My research develops deep learning-based intrusion detection systems for network attack detection and
    classification, with a focus on DoS/DDoS attacks and IoT networks. I have published 6 journal articles and 4 conference papers, hold
    3 published Indian patents and designs, and review for 9 international journals.

